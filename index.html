<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        /* Resets the page and forces a pitch-black background */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            display: grid;
            place-items: center; /* Centers the skeleton perfectly */
            overflow: hidden;    /* Prevents accidental scrollbars */
        }

        /* Styles the skeleton image */
        .skeleton-img {
            max-width: 80%;
            max-height: 70vh;
            object-fit: contain;
            /* Optional: Adds a subtle, eerie white glow behind the skeleton */
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
        }
    </style>
</head>
<body>

    <!-- Centered Skeleton Image -->
    <img class="skeleton-img" src="https://openclipart.org/342563" alt="Skeleton">

</body>
</html>
